name: Android

# Builds WordCraft for Android (arm64 APK) with apps/wordcraft-android/build-apk.sh.
# Every push and pull request uploads the APK as a workflow artifact; a tag `android-v*`
# also publishes it as a GitHub release.
#
# Signing: set the repository secrets ANDROID_KEYSTORE_BASE64 (`base64 -w0 your.jks`),
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS so every build is signed with the same key
# and installs as an update over the last. Without them each run signs with a fresh key, and
# Android asks you to uninstall the old build first.

on:
  push:
    branches: [main, android]
    tags: ["android-v*"]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths: ["apps/wordcraft-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Unit tests (gestures, inbox)
        run: cargo test -p wordcraft-android --lib

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a throwaway key."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: apps/wordcraft-android/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WordCraft-android-arm64
          path: dist/android/*.apk
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/android/*.apk --title "WordCraft for Android ${GITHUB_REF_NAME#android-v}" --notes-file apps/wordcraft-android/README.md --prerelease
